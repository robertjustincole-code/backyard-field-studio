name: Browser smoke tests
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
  export:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: brew list ffmpeg >/dev/null || brew install ffmpeg
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install webkit
      - run: node tests/export.mjs
